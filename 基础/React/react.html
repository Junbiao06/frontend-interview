<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini React Fiber 实现</title>
    <style>
      :root {
        color: #172033;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f3f6fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      .card {
        width: min(420px, calc(100vw - 64px));
        padding: 32px;
        border: 1px solid #dce3ef;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgb(30 55 90 / 10%);
      }

      h1 {
        margin-top: 0;
      }

      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        color: #3158d4;
        background: #edf2ff;
        font-style: normal;
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        color: #ffffff;
        background: #3158d4;
        cursor: pointer;
      }

      li + li {
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>这个示例需要启用 JavaScript。</noscript>
    <script src="./react.js"></script>
  </body>
</html>
